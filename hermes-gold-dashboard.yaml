name: hermes-gold
label: Hermes Gold
description: Warm gold-on-charcoal companion theme for the Hermes Agent web dashboard

palette:
  background: "#141414"
  midground: "#E9E4DC"
  foreground:
    hex: "#FFD800"
    alpha: 1
  warmGlow: "rgba(255, 216, 0, 0.20)"
  noiseOpacity: 0.8

typography:
  fontSans: 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  fontMono: '"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace'
  fontDisplay: '"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace'
  baseSize: "15px"
  lineHeight: "1.55"
  letterSpacing: "0.01em"

layout:
  radius: "0"
  density: comfortable

colorOverrides:
  card: "#1B1B1D"
  cardForeground: "#E9E4DC"
  popover: "#1B1B1D"
  popoverForeground: "#E9E4DC"
  primary: "#FFD800"
  primaryForeground: "#141414"
  secondary: "#1B1B1D"
  secondaryForeground: "#E9E4DC"
  muted: "#272729"
  mutedForeground: "#8C8C8D"
  accent: "#484122"
  accentForeground: "#FFD800"
  destructive: "#EF635E"
  destructiveForeground: "#FFFFFF"
  border: "#484122"
  input: "#484122"
  ring: "#FFD800"
  success: "#78A978"
  warning: "#FFBE00"
